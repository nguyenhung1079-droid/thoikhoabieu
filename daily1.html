<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#58a942"><link rel="manifest" href="manifest.json"><title>Minh Trường — Daily Dashboard</title><style>
body{margin:0;background:#f5f7f5;color:#202124;font:15px system-ui}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e1e5e1;border-radius:18px;padding:18px;margin-bottom:14px}h1{margin:4px 0}.muted{color:#68706a;font-size:13px}.task{display:flex;gap:9px;padding:11px;border:1px solid #e4e7e4;border-radius:11px;margin:7px 0}.task input{accent-color:#58a942}.done{text-decoration:line-through;color:#777;background:#f1f9ef}.pts{margin-left:auto;font-weight:800;color:#4d8b3e}button{border:0;background:#58a942;color:#fff;border-radius:9px;padding:9px 12px;font-weight:800}input{padding:9px;border:1px solid #ddd;border-radius:9px}form{display:grid;grid-template-columns:1fr 70px auto;gap:7px}@media(max-width:550px){form{grid-template-columns:1fr 65px}.wrap{padding:10px}}</style></head><body><main class="wrap"><div class="card"><div class="muted">🌱 FAMILY GROWTH</div><h1>Nguyễn Minh Trường</h1><div class="muted">Lớp 1 • Daily Dashboard</div><p><input id="date" type="date"></p><h2>✅ Checklist hôm nay</h2><form onsubmit="add(event)"><input id="txt" placeholder="Ví dụ: Đọc sách 15 phút" required><input id="pts" type="number" value="10" min="1"><button>Thêm</button></form><div id="list"></div></div><div class="card"><h2>🎯 Nguyên tắc</h2><div class="muted">Nhiệm vụ ngắn, rõ ràng; ưu tiên học tập, vận động, tự phục vụ và kỹ năng sống. Điểm ⭐ dùng để ghi nhận nỗ lực.</div></div></main><script>
const K='minhtruong31';let S=JSON.parse(localStorage.getItem(K)||'{"days":{}}');const d=document.getElementById('date');function iso(x){return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10)}d.value=iso(new Date());d.onchange=render;function q(){let k=d.value;if(!S.days[k])S.days[k]={tasks:[]};return S.days[k]}function save(){localStorage.setItem(K,JSON.stringify(S))}function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c))}function add(e){e.preventDefault();q().tasks.push({text:document.getElementById('txt').value.trim(),points:+document.getElementById('pts').value||10,done:false});save();e.target.reset();render()}function toggle(i){q().tasks[i].done=!q().tasks[i].done;save();render()}function render(){document.getElementById('list').innerHTML=q().tasks.map((t,i)=>'<div class="task '+(t.done?'done':'')+'"><input type="checkbox" '+(t.done?'checked':'')+' onchange="toggle('+i+')"><span>'+esc(t.text)+'</span><span class="pts">+'+t.points+'⭐</span></div>').join('')||'<div class="muted">Chưa có nhiệm vụ.</div>'}render()
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
