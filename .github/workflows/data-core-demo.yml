name: FAMILY GROWTH DATA CORE DEMO
on:
  push:
    branches: ["dev/data-core-1.0"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./data-core
      - id: deployment
        uses: actions/deploy-pages@v4
