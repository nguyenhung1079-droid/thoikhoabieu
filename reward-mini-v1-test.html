<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FGS Reward Mini V1 Test</title><style>body{font:15px system-ui;max-width:760px;margin:30px auto;padding:16px;background:#f5f6fa;color:#172033}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:16px;margin:12px 0}button{padding:10px 14px;margin:5px;border-radius:10px;border:1px solid #ddd;font-weight:800}.ok{color:#16784b}.bad{color:#b33}</style></head><body><h1>🎮 Reward Mini V1 — Test Harness</h1><div class="card"><b>Không dùng dữ liệu Stable Base.</b><p>Trang này chạy với dữ liệu giả lập trong bộ nhớ để kiểm thử Reward Mini trước khi tích hợp.</p></div><div class="card"><div id="summary"></div><button onclick="buy('roblox20')">20 ⭐ → 20 phút</button><button onclick="buy('roblox30')">30 ⭐ → 30 phút</button><button onclick="resetTest()">Reset</button></div><div class="card"><h2>Automated checks</h2><div id="tests"></div></div><script src="reward-mini-v1.js"></script><script>let S,balance;function resetTest(){S={rewardHistory:{ta:[],mt:[]}};balance=100;render();runTests()}function buy(id){const r=FGSRobloxRewardMini.redeem(S,id,balance);if(r.ok){balance-=r.item.cost}else alert(r.reason);render()}function render(){document.getElementById('summary').innerHTML=`⭐ Balance: <b>${balance}</b><br>⏱ Roblox hôm nay: <b>${FGSRobloxRewardMini.usedToday(S)} / 60 phút</b><br>🧾 Pass đã mua: <b>${S.rewardHistory.ta.length}</b>`}function runTests(){const out=[];function t(name,ok){out.push(`<div class="${ok?'ok':'bad'}">${ok?'PASS':'FAIL'} — ${name}</div>`)}let a={rewardHistory:{ta:[],mt:[]}};let r=FGSRobloxRewardMini.redeem(a,'roblox20',20);t('20⭐ mua được pass 20 phút',r.ok&&r.item.cost===20&&r.item.minutes===20);t('Lịch sử ghi Roblox Pass',a.rewardHistory.ta[0]?.kind==='Roblox Pass');t('Minh Trường không bị thay đổi',a.rewardHistory.mt.length===0);r=FGSRobloxRewardMini.canRedeem(a,'roblox30',10);t('Không đủ điểm bị chặn',!r.ok&&r.reason==='INSUFFICIENT_STARS');let b={rewardHistory:{ta:[],mt:[]}};FGSRobloxRewardMini.redeem(b,'roblox30',100);FGSRobloxRewardMini.redeem(b,'roblox30',70);r=FGSRobloxRewardMini.canRedeem(b,'roblox20',40);t('Đủ 60 phút thì chặn mua thêm',!r.ok&&r.reason==='DAILY_LIMIT');t('Tổng phút hôm nay = 60',FGSRobloxRewardMini.usedToday(b)===60);document.getElementById('tests').innerHTML=out.join('')}resetTest()</script></body></html>
